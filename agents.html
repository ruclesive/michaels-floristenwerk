<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission Control · Agent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08060f;--bg2:#0d0a1a;--panel:#120e22;--panel2:#171233;
  --line:rgba(168,85,247,0.22);--line2:rgba(168,85,247,0.4);
  --ink:#e7defb;--dim:rgba(231,222,251,0.5);--faint:rgba(231,222,251,0.28);
  --pink:#ff2d95;--mag:#ff4fd8;--purple:#a855f7;--violet:#7c3aed;
  --cyan:#22d3ee;--green:#39ff8b;--amber:#ffb020;--red:#ff4d5e;
  --glow-pink:0 0 12px rgba(255,45,149,.55);
  --glow-cyan:0 0 12px rgba(34,211,238,.5);
  --glow-green:0 0 10px rgba(57,255,139,.5);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:1.45;
  overflow:hidden;
  background-image:
    radial-gradient(1200px 600px at 80% -10%,rgba(124,58,237,.22),transparent 60%),
    radial-gradient(900px 500px at 0% 110%,rgba(255,45,149,.14),transparent 55%);
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(168,85,247,.35);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(168,85,247,.6)}
a{color:inherit}
.scan{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.4;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px)}
.mono-glow{text-shadow:0 0 8px currentColor}

/* ── LAYOUT ── */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{
  display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(124,58,237,.18),rgba(255,45,149,.12));
  backdrop-filter:blur(4px);position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 20px;border-right:1px solid var(--line);min-width:250px}
.brand .logo{
  font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;
  background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .ver{font-size:9px;color:var(--faint);letter-spacing:.2em}
.brand .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:var(--glow-green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.kpis{flex:1;display:flex;overflow-x:auto}
.kpi{padding:9px 20px;border-right:1px solid var(--line);min-width:118px;display:flex;flex-direction:column;justify-content:center}
.kpi .l{font-size:8.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.kpi .v{font-size:16px;font-weight:700;margin-top:2px}
.kpi .d{font-size:9px;color:var(--dim)}
.v.rev{color:var(--green)}.v.spend{color:var(--amber)}.v.tasks{color:var(--cyan)}
.v.blk{color:var(--red)}.v.act{color:var(--mag)}
.clock{padding:0 18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;border-left:1px solid var(--line)}
.clock .t{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.05em}
.clock .z{font-size:8.5px;color:var(--faint);letter-spacing:.15em}

.main{display:grid;grid-template-columns:262px 1fr;min-height:0}

/* ── CREW SIDEBAR ── */
.crew{border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg));overflow-y:auto;position:relative;z-index:10}
.crew-hd{padding:12px 16px 8px;position:sticky;top:0;background:var(--bg2);z-index:2}
.crew-hd .t{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.22em;color:var(--mag);text-shadow:var(--glow-pink)}
.crew-hd .s{font-size:9px;color:var(--faint);margin-top:3px}
.agent{
  padding:11px 16px;border-top:1px solid rgba(168,85,247,.1);cursor:pointer;
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;transition:background .15s;position:relative;
}
.agent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:.15s}
.agent:hover{background:rgba(168,85,247,.08)}
.agent.sel{background:rgba(255,45,149,.09)}
.agent.sel::before{background:var(--mag);box-shadow:var(--glow-pink)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;position:relative}
.dot.idle{background:var(--dim)}
.dot.working{background:var(--green);box-shadow:var(--glow-green);animation:pulse 1.2s infinite}
.dot.blocked{background:var(--red);box-shadow:0 0 10px rgba(255,77,94,.6);animation:pulse .8s infinite}
.dot.auto{background:var(--cyan);box-shadow:var(--glow-cyan);animation:pulse 1.5s infinite}
.a-name{font-weight:700;font-size:12.5px}
.a-role{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-meta{text-align:right;font-size:9px;color:var(--faint);line-height:1.3}
.a-meta .st{font-weight:600}
.st.idle{color:var(--dim)}.st.working{color:var(--green)}.st.blocked{color:var(--red)}.st.auto{color:var(--cyan)}

/* ── CONTENT ── */
.content{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto;position:relative;z-index:10}
.tab{
  padding:11px 20px;font-size:11px;letter-spacing:.15em;color:var(--dim);cursor:pointer;
  border-right:1px solid rgba(168,85,247,.12);white-space:nowrap;text-transform:uppercase;
  transition:.15s;position:relative;background:transparent;font-family:inherit;
}
.tab:hover{color:var(--ink);background:rgba(168,85,247,.06)}
.tab.on{color:var(--cyan);text-shadow:var(--glow-cyan)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 8px rgba(34,211,238,.6)}
.tab .badge{display:inline-block;margin-left:6px;font-size:9px;padding:1px 6px;border-radius:10px;background:rgba(168,85,247,.2);color:var(--purple)}
.view{flex:1;overflow-y:auto;padding:20px;position:relative}
.view-hd{margin-bottom:16px}
.view-hd h1{font-family:'Orbitron',sans-serif;font-size:20px;letter-spacing:.03em;background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.view-hd .sub{font-size:10px;color:var(--faint);margin-top:5px;letter-spacing:.05em}

.panel{border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(23,18,51,.55),rgba(18,14,34,.55));margin-bottom:14px;overflow:hidden}
.panel-hd{padding:9px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-bd{padding:12px 14px}

/* alert */
.alert{border:1px solid rgba(255,77,94,.5);border-radius:8px;background:rgba(255,77,94,.08);padding:12px 14px;margin-bottom:14px;box-shadow:0 0 24px rgba(255,77,94,.12) inset}
.alert .hd{color:var(--red);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.alert .row{font-size:11.5px;padding:6px 0;border-top:1px solid rgba(255,77,94,.18)}
.alert .row b{color:var(--amber)}

/* summary strip */
.summary{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--dim);border:1px dashed var(--line2);border-radius:8px;padding:11px 14px;margin-bottom:16px}
.summary b{color:var(--ink)}
.summary span{display:flex;align-items:center;gap:6px}
.chip{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px}
.chip.g{background:rgba(57,255,139,.14);color:var(--green)}
.chip.c{background:rgba(34,211,238,.14);color:var(--cyan)}
.chip.r{background:rgba(255,77,94,.14);color:var(--red)}
.chip.a{background:rgba(255,176,32,.14);color:var(--amber)}

/* task feed */
.feed{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid rgba(168,85,247,.1)}
.task:first-child{border-top:none}
.task .who{font-weight:700;font-size:11px;color:var(--mag);min-width:56px}
.task .desc{font-size:11.5px;color:var(--ink)}
.task .desc .sub{font-size:9.5px;color:var(--faint)}
.pill{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:4px;font-weight:700;white-space:nowrap}
.pill.done{background:rgba(57,255,139,.15);color:var(--green);border:1px solid rgba(57,255,139,.35)}
.pill.run{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.35)}
.pill.review{background:rgba(255,176,32,.15);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.pill.block{background:rgba(255,77,94,.15);color:var(--red);border:1px solid rgba(255,77,94,.35)}
.pill.queue{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.35)}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{border:1px solid var(--line);border-radius:8px;background:rgba(18,14,34,.5);display:flex;flex-direction:column;min-height:220px}
.col-hd{padding:9px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.col-hd .n{background:rgba(168,85,247,.2);border-radius:10px;padding:0 7px;font-size:9px}
.card{margin:8px;padding:9px 10px;border-radius:6px;background:rgba(23,18,51,.7);border-left:2px solid var(--purple);font-size:11px}
.card .who{font-size:9px;color:var(--mag);font-weight:700;letter-spacing:.05em}
.card .t{margin-top:3px;color:var(--ink)}
.card.g{border-left-color:var(--green)}.card.c{border-left-color:var(--cyan)}
.card.a{border-left-color:var(--amber)}.card.r{border-left-color:var(--red)}

/* revenue / treasury bars */
.big{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:800}
.big.g{color:var(--green);text-shadow:0 0 18px rgba(57,255,139,.4)}
.big.a{color:var(--amber);text-shadow:0 0 18px rgba(255,176,32,.35)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:linear-gradient(180deg,rgba(23,18,51,.5),transparent)}
.stat .l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.bar-row{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:11px}
.bar-row .nm{color:var(--dim)}
.track{height:14px;background:rgba(168,85,247,.1);border-radius:7px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fill.g{background:linear-gradient(90deg,var(--green),var(--cyan))}
.fill.a{background:linear-gradient(90deg,var(--amber),var(--pink))}
.fill.p{background:linear-gradient(90deg,var(--purple),var(--mag))}
.bar-row .amt{font-weight:700;min-width:64px;text-align:right}

/* decisions / timeline */
.decision{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:rgba(23,18,51,.4)}
.decision .q{font-size:12px;margin-bottom:4px}
.decision .who{font-size:9px;color:var(--mag);letter-spacing:.1em;text-transform:uppercase}
.decision .acts{display:flex;gap:8px;margin-top:10px}
.btn{font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:5px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink);transition:.15s}
.btn:hover{background:rgba(168,85,247,.12)}
.btn.y{border-color:rgba(57,255,139,.5);color:var(--green)}
.btn.y:hover{background:rgba(57,255,139,.12);box-shadow:var(--glow-green)}
.btn.n{border-color:rgba(255,77,94,.5);color:var(--red)}
.btn.n:hover{background:rgba(255,77,94,.12)}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--mag),var(--cyan))}
.tl .ev{position:relative;padding:8px 0}
.tl .ev::before{content:'';position:absolute;left:-19px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--cyan);box-shadow:var(--glow-cyan)}
.tl .ev .ts{font-size:9px;color:var(--faint);letter-spacing:.08em}
.tl .ev .tx{font-size:11.5px}
.tl .ev .tx b{color:var(--mag)}

/* star chart */
#starwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(124,58,237,.18),var(--bg) 70%);position:relative}
#stars{display:block;width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:10px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.ld{width:10px;height:10px;border-radius:50%}

.empty{color:var(--faint);font-size:11px;text-align:center;padding:30px}
.hidden{display:none!important}
@media(max-width:860px){
  .main{grid-template-columns:1fr}
  .crew{display:none}
  .board{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="scan"></div>
<div id="app">
  <!-- TOP COMMAND BAR -->
  <header class="topbar">
    <div class="brand">
      <span class="pulse"></span>
      <div>
        <div class="logo">MISSION CONTROL</div>
        <div class="ver">AGENT OPS · v6</div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="clock">
      <div class="t" id="clock">--:--:--</div>
      <div class="z">UTC · LIVE</div>
    </div>
  </header>

  <div class="main">
    <!-- CREW -->
    <aside class="crew">
      <div class="crew-hd">
        <div class="t">CREW</div>
        <div class="s">autonomous agents · <span id="crewCount">0</span> online</div>
      </div>
      <div id="crewList"></div>
    </aside>

    <!-- CONTENT -->
    <section class="content">
      <nav class="tabs" id="tabs"></nav>
      <div class="view" id="view"></div>
    </section>
  </div>
</div>

<script>
/* ══════════════════ DATA MODEL ══════════════════
   Everything is driven from these arrays — edit them to wire in your
   own agents / feeds. The dashboard renders + live-simulates from here. */

const AGENTS = [
  {id:'matt',   name:'Matt',    role:'Operations Manager',   mode:'scheduled', status:'idle',    cycle:7,  note:'Awaiting orders'},
  {id:'finn',   name:'Finn',    role:'Fiverr Fulfillment',   mode:'event',     status:'working', note:'Delivering gig #4471'},
  {id:'dennis', name:'Dennis',  role:'Research & Strategy',  mode:'event',     status:'idle',    note:'Awaiting orders'},
  {id:'phun',   name:'Phun',    role:'YouTube AI Music',     mode:'event',     status:'blocked', note:'OAuth + Suno key missing'},
  {id:'buno',   name:'Buno',    role:'Etsy Executor',        mode:'event',     status:'working', note:'Listing 12 products'},
  {id:'luke',   name:'Luke',    role:'TikTok Marketing',     mode:'event',     status:'idle',    note:'Awaiting orders'},
  {id:'mav',    name:'Maverick',role:'Autonomous Experiment',mode:'auto',      status:'auto',    note:'Running experiment'},
];

const BLOCKERS = [
  {who:'Phun', txt:'YouTube channel + OAuth not configured', need:'Suno API key not deployed'},
];

let TASKS = [
  {who:'Finn',   st:'run',    t:'Fulfill Fiverr order #4471', sub:'logo pack · 3 concepts'},
  {who:'Buno',   st:'run',    t:'Publish Etsy listing "Sunset Print"', sub:'pricing + SEO tags'},
  {who:'Dennis', st:'review', t:'Q3 niche report ready for review', sub:'skilled-trades occupation'},
  {who:'Maverick',st:'run',   t:'A/B test 2 ad hooks', sub:'autonomous · budget $5'},
  {who:'Luke',   st:'done',   t:'Scheduled 4 TikToks', sub:'do NOT fall behind'},
  {who:'Buno',   st:'done',   t:'Repriced 18 SKUs', sub:'margin +6%'},
  {who:'Matt',   st:'done',   t:'Daily standup synced', sub:'7 agents polled'},
  {who:'Phun',   st:'block',  t:'Upload track "Neon Rain"', sub:'blocked · OAuth'},
  {who:'Dennis', st:'queue',  t:'Draft competitor teardown', sub:'queued'},
];

const DECISIONS = [
  {who:'Buno',   q:'Kill Etsy listing "Vintage Poster" — 0 sales in 30d, $0.40/day ad spend. Cut it?'},
  {who:'Maverick',q:'Reallocate $15 from paused YouTube budget into TikTok ads?'},
  {who:'Finn',   q:'Accept rush gig at 1.5× rate? Delivery in 6h, tight but doable.'},
];

const REVENUE = [
  {src:'Fiverr',  amt:1324.30, c:'g'},
  {src:'Etsy',    amt:  612.18, c:'g'},
  {src:'TikTok Shop', amt:198.90, c:'p'},
  {src:'Whatapviptht', amt:80.60, c:'p'},
];

const SPEND = [
  {src:'Finn',    amt:12.42, c:'a'},
  {src:'Dennis',  amt: 8.99, c:'a'},
  {src:'Maverick',amt: 5.05, c:'a'},
  {src:'Buno',    amt: 4.07, c:'a'},
  {src:'Luke',    amt: 3.30, c:'a'},
  {src:'Phun',    amt: 0.00, c:'a'},
];

const TIMELINE = [
  {ago:'2m',  tx:'<b>Buno</b> published Etsy listing "Sunset Print" — live'},
  {ago:'7m',  tx:'<b>Finn</b> delivered gig #4468 — buyer tipped $6.00'},
  {ago:'11m', tx:'<b>Maverick</b> spun up experiment: ad-hook A/B'},
  {ago:'19m', tx:'<b>Dennis</b> finished niche report → sent for review'},
  {ago:'26m', tx:'<b>Phun</b> BLOCKED — OAuth not configured'},
  {ago:'41m', tx:'<b>Luke</b> scheduled 4 TikToks for the week'},
  {ago:'58m', tx:'<b>Matt</b> ran daily standup — 7 agents polled'},
];

/* ══════════════════ STATE ══════════════════ */
const ST = {tab:'focus', sel:null,
  revenue:2215.98, spend:31.88, tasksDone:76, tasksToday:4, blocked:1};

/* ══════════════════ HELPERS ══════════════════ */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const money = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const STLABEL = {idle:'idle',working:'working',blocked:'blocked',auto:'autonomous'};

/* ══════════════════ TOP KPIs ══════════════════ */
function renderKPIs(){
  const online = AGENTS.filter(a=>a.status!=='idle').length;
  const data = [
    {l:'Total Revenue', v:money(ST.revenue), d:'all sources', cls:'rev'},
    {l:'Spend · Today',  v:money(ST.spend), d:'OpenRouter + APIs', cls:'spend'},
    {l:'Tasks Done',     v:ST.tasksDone, d:ST.tasksToday+' created today', cls:'tasks'},
    {l:'Blocked',        v:ST.blocked, d:'need your action', cls:'blk'},
    {l:'Agents Active',  v:online+'/'+AGENTS.length, d:'firing now', cls:'act'},
  ];
  $('#kpis').innerHTML='';
  data.forEach(k=>{
    const d=el('div','kpi');
    d.innerHTML=`<div class="l">${k.l}</div><div class="v ${k.cls}">${k.v}</div><div class="d">${k.d}</div>`;
    $('#kpis').append(d);
  });
}

/* ══════════════════ CREW ══════════════════ */
function renderCrew(){
  const list=$('#crewList');list.innerHTML='';
  AGENTS.forEach(a=>{
    const row=el('div','agent'+(ST.sel===a.id?' sel':''));
    row.onclick=()=>{ST.sel=(ST.sel===a.id?null:a.id);renderCrew();if(ST.tab!=='focus'){ST.tab='focus';renderTabs();}renderView();};
    const meta = a.status==='blocked' ? 'action req' :
                 a.mode==='scheduled' ? 'cycle '+a.cycle+'s' :
                 a.mode==='auto' ? 'autonomous' : 'event-driven';
    row.innerHTML=`
      <span class="dot ${a.status}"></span>
      <div style="min-width:0">
        <div class="a-name">${a.name}</div>
        <div class="a-role">${a.role}</div>
      </div>
      <div class="a-meta"><div class="st ${a.status}">${STLABEL[a.status]}</div><div>${meta}</div></div>`;
    list.append(row);
  });
  $('#crewCount').textContent = AGENTS.filter(a=>a.status!=='idle').length;
}

/* ══════════════════ TABS ══════════════════ */
const TABS=[
  {id:'focus',    label:'Focus'},
  {id:'tasks',    label:'Tasks', badge:()=>TASKS.length},
  {id:'decisions',label:'Decisions', badge:()=>DECISIONS.length},
  {id:'timeline', label:'Timeline'},
  {id:'factory',  label:'Factory'},
  {id:'revenue',  label:'Revenue Bay'},
  {id:'treasury', label:'Treasury'},
  {id:'starchart',label:'Star Chart'},
];
function renderTabs(){
  const nav=$('#tabs');nav.innerHTML='';
  TABS.forEach(t=>{
    const b=el('button','tab'+(ST.tab===t.id?' on':''));
    b.innerHTML=t.label+(t.badge?` <span class="badge">${t.badge()}</span>`:'');
    b.onclick=()=>{ST.tab=t.id;renderTabs();renderView();};
    nav.append(b);
  });
}

/* ══════════════════ VIEWS ══════════════════ */
function pill(st){
  const map={run:['run','running'],done:['done','done'],review:['review','review'],
             block:['block','blocked'],queue:['queue','queued']};
  const [c,l]=map[st]||['queue',st];return `<span class="pill ${c}">${l}</span>`;
}
function taskRows(list){
  if(!list.length) return `<div class="empty">no tasks in this room yet</div>`;
  return `<div class="feed">`+list.map(t=>`
    <div class="task">
      <div class="who">${t.who}</div>
      <div class="desc">${t.t}<div class="sub">${t.sub||''}</div></div>
      ${pill(t.st)}
    </div>`).join('')+`</div>`;
}

function viewFocus(){
  const selAgent = ST.sel ? AGENTS.find(a=>a.id===ST.sel) : null;
  const scope = selAgent ? TASKS.filter(t=>t.who===selAgent.name) : TASKS;
  const alert = BLOCKERS.length ? `
    <div class="alert">
      <div class="hd">⚠ Agents blocked on your action</div>
      ${BLOCKERS.map(b=>`<div class="row"><b>${b.who}:</b> ${b.txt} · ${b.need}</div>`).join('')}
    </div>` : '';
  const summary = `
    <div class="summary">
      <span>Today: <b>${ST.tasksToday}</b> tasks created</span>
      <span><span class="chip a">${money(0.09)}</span> queue spend</span>
      <span><span class="chip g">${ST.tasksDone}</span> done</span>
      <span><span class="chip r">${ST.blocked}</span> blocked</span>
      <span><span class="chip c">${AGENTS.filter(a=>a.status!=='idle').length}</span> firing now</span>
    </div>`;
  const title = selAgent ? selAgent.name+' — '+selAgent.role : 'OPS CONSOLE — Command Center';
  const sub = selAgent
    ? `filtered to ${selAgent.name} · ${selAgent.note} · click again to clear`
    : 'live view · auto-refreshes every 5s · same data as Command, filtered for this room';
  return `
    <div class="view-hd"><h1>${title}</h1><div class="sub">${sub}</div></div>
    ${selAgent?'':alert}
    ${summary}
    <div class="panel">
      <div class="panel-hd"><span>${selAgent?selAgent.name+"'s queue":'Live task feed'}</span><span style="color:var(--faint)">${scope.length} items</span></div>
      <div class="panel-bd" style="padding:0">${taskRows(scope)}</div>
    </div>`;
}

function viewTasks(){
  const groups=[['run','Running'],['review','Awaiting Review'],['queue','Queued'],['done','Completed'],['block','Blocked']];
  return `<div class="view-hd"><h1>TASKS</h1><div class="sub">${TASKS.length} tasks across all agents · grouped by state</div></div>`+
    groups.map(([k,label])=>{
      const rows=TASKS.filter(t=>t.st===k);if(!rows.length)return '';
      return `<div class="panel"><div class="panel-hd"><span>${label}</span><span style="color:var(--faint)">${rows.length}</span></div><div class="panel-bd" style="padding:0">${taskRows(rows)}</div></div>`;
    }).join('');
}

function viewDecisions(){
  return `<div class="view-hd"><h1>DECISIONS</h1><div class="sub">${DECISIONS.length} agents waiting on a judgment call · your approval fires their next action</div></div>`+
    (DECISIONS.length?DECISIONS.map((d,i)=>`
      <div class="decision" data-i="${i}">
        <div class="who">${d.who} asks</div>
        <div class="q">${d.q}</div>
        <div class="acts">
          <button class="btn y" onclick="resolveDecision(${i},true)">Approve</button>
          <button class="btn n" onclick="resolveDecision(${i},false)">Reject</button>
          <button class="btn" onclick="resolveDecision(${i},null)">Defer</button>
        </div>
      </div>`).join(''):`<div class="empty">✓ no decisions pending — agents are running clear</div>`);
}
function resolveDecision(i,val){
  const d=DECISIONS[i];if(!d)return;
  const verb = val===true?'approved':val===false?'rejected':'deferred';
  TIMELINE.unshift({ago:'now', tx:`<b>You</b> ${verb} — ${d.who}: ${d.q.slice(0,42)}…`});
  DECISIONS.splice(i,1);renderTabs();renderView();
}

function viewTimeline(){
  return `<div class="view-hd"><h1>TIMELINE</h1><div class="sub">chronological event log · every agent action, newest first</div></div>
    <div class="panel"><div class="panel-bd"><div class="tl">`+
    TIMELINE.map(e=>`<div class="ev"><div class="ts">${e.ago==='now'?'JUST NOW':e.ago+' ago'}</div><div class="tx">${e.tx}</div></div>`).join('')+
    `</div></div></div>`;
}

function viewFactory(){
  const cols=[
    {k:'run',   label:'In Progress', cls:'c'},
    {k:'review',label:'Approvals',   cls:'a'},
    {k:'done',  label:'Delivered',   cls:'g'},
    {k:'block', label:'Blocked',     cls:'r'},
  ];
  return `<div class="view-hd"><h1>FACTORY</h1><div class="sub">task pipeline · executor agents · auto-refresh 6s</div></div>
    <div class="board">`+cols.map(c=>{
      const cards=TASKS.filter(t=>t.st===c.k);
      return `<div class="col"><div class="col-hd"><span>${c.label}</span><span class="n">${cards.length}</span></div>`+
        (cards.length?cards.map(t=>`<div class="card ${c.cls}"><div class="who">${t.who}</div><div class="t">${t.t}</div></div>`).join(''):`<div class="empty" style="padding:20px">—</div>`)+
        `</div>`;
    }).join('')+`</div>`;
}

function viewRevenue(){
  const total=REVENUE.reduce((s,r)=>s+r.amt,0);
  const max=Math.max(...REVENUE.map(r=>r.amt));
  return `<div class="view-hd"><h1>REVENUE BAY</h1><div class="sub">all income streams in one place · auto-refresh 30s</div></div>
    <div class="stat-row">
      <div class="stat"><div class="l">Gross Total</div><div class="v" style="color:var(--green)">${money(ST.revenue)}</div></div>
      <div class="stat"><div class="l">Stripe (paid out)</div><div class="v" style="color:var(--cyan)">${money(891.68)}</div></div>
      <div class="stat"><div class="l">Agent-Attributed</div><div class="v" style="color:var(--mag)">${money(total)}</div></div>
      <div class="stat"><div class="l">30-day Trend</div><div class="v" style="color:var(--green)">▲ 18%</div></div>
    </div>
    <div class="panel"><div class="panel-hd"><span>Revenue by source</span><span style="color:var(--faint)">what the agents earned</span></div>
      <div class="panel-bd">`+
      REVENUE.map(r=>`<div class="bar-row"><div class="nm">${r.src}</div><div class="track"><div class="fill ${r.c}" style="width:${(r.amt/max*100).toFixed(0)}%"></div></div><div class="amt" style="color:var(--green)">${money(r.amt)}</div></div>`).join('')+
      `</div></div>`;
}

function viewTreasury(){
  const total=SPEND.reduce((s,r)=>s+r.amt,0);
  const max=Math.max(...SPEND.map(r=>r.amt))||1;
  return `<div class="view-hd"><h1>TREASURY</h1><div class="sub">OpenRouter spend · per-agent costs · per-task spend · auto-refresh 60s</div></div>
    <div class="stat-row">
      <div class="stat"><div class="l">Total Spent</div><div class="v" style="color:var(--amber)">${money(ST.spend)}</div></div>
      <div class="stat"><div class="l">Remaining Budget</div><div class="v" style="color:var(--green)">${money(68.12)}</div></div>
      <div class="stat"><div class="l">Cost / Task</div><div class="v" style="color:var(--cyan)">${money(ST.spend/Math.max(ST.tasksDone,1))}</div></div>
      <div class="stat"><div class="l">Net Margin</div><div class="v" style="color:var(--green)">${money(ST.revenue-ST.spend)}</div></div>
    </div>
    <div class="panel"><div class="panel-hd"><span>Per-agent cost</span><span style="color:var(--faint)">OpenRouter LLM · image · video</span></div>
      <div class="panel-bd">`+
      SPEND.map(r=>`<div class="bar-row"><div class="nm">${r.src}</div><div class="track"><div class="fill a" style="width:${(r.amt/max*100).toFixed(0)}%"></div></div><div class="amt" style="color:var(--amber)">${money(r.amt)}</div></div>`).join('')+
      `</div></div>`;
}

function viewStar(){
  return `<div class="view-hd"><h1>STAR CHART</h1><div class="sub">agent constellation · orbit = activity level · click a star to focus that agent</div></div>
    <div id="starwrap"><canvas id="stars"></canvas></div>
    <div class="legend">
      <span><span class="ld" style="background:var(--green);box-shadow:var(--glow-green)"></span>working</span>
      <span><span class="ld" style="background:var(--cyan);box-shadow:var(--glow-cyan)"></span>autonomous</span>
      <span><span class="ld" style="background:var(--red)"></span>blocked</span>
      <span><span class="ld" style="background:var(--dim)"></span>idle</span>
    </div>`;
}

const VIEWS={focus:viewFocus,tasks:viewTasks,decisions:viewDecisions,timeline:viewTimeline,
  factory:viewFactory,revenue:viewRevenue,treasury:viewTreasury,starchart:viewStar};

function renderView(){
  $('#view').innerHTML = (VIEWS[ST.tab]||viewFocus)();
  if(ST.tab==='starchart') startStars();
  else stopStars();
}

/* ══════════════════ STAR CHART (canvas) ══════════════════ */
let starRAF=null;
const STAR_COLOR={working:'#39ff8b',auto:'#22d3ee',blocked:'#ff4d5e',idle:'#8a7fb0'};
function startStars(){
  const cv=$('#stars');if(!cv)return;
  const ctx=cv.getContext('2d');
  function resize(){const w=cv.parentElement.clientWidth;cv.width=w;cv.height=Math.max(340,w*0.42);}
  resize();window.onresize=()=>{if($('#stars')){resize();}};
  const cx=()=>cv.width/2, cy=()=>cv.height/2;
  const bodies=AGENTS.map((a,i)=>({a,
    r:70+i*((Math.min(cv.width,cv.height)*0.42-70)/AGENTS.length),
    ang:Math.random()*Math.PI*2,
    spd:(a.status==='idle'?0.0015:a.status==='working'?0.006:a.status==='auto'?0.009:0.003)*(i%2?1:-1),
    size:a.status==='idle'?3:5}));
  let t=0;
  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // core sun
    const cxx=cx(),cyy=cy();
    const g=ctx.createRadialGradient(cxx,cyy,0,cxx,cyy,46);
    g.addColorStop(0,'rgba(255,79,216,.9)');g.addColorStop(.4,'rgba(168,85,247,.5)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cxx,cyy,46,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 11px JetBrains Mono';ctx.textAlign='center';
    ctx.fillText('CORE',cxx,cyy+4);
    bodies.forEach(b=>{
      // orbit
      ctx.strokeStyle='rgba(168,85,247,.14)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cxx,cyy,b.r,0,7);ctx.stroke();
      b.ang+=b.spd;
      const x=cxx+Math.cos(b.ang)*b.r, y=cyy+Math.sin(b.ang)*b.r;
      const col=STAR_COLOR[b.a.status];
      const pulse=b.a.status==='idle'?1:1+Math.sin(t*0.06+b.r)*0.25;
      // glow
      const gg=ctx.createRadialGradient(x,y,0,x,y,16*pulse);
      gg.addColorStop(0,col);gg.addColorStop(1,'transparent');
      ctx.fillStyle=gg;ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x,y,16*pulse,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,b.size,0,7);ctx.fill();
      ctx.fillStyle=ST.sel===b.a.id?'#fff':'rgba(231,222,251,.8)';
      ctx.font=(ST.sel===b.a.id?'700 ':'')+'10px JetBrains Mono';ctx.textAlign='center';
      ctx.fillText(b.a.name,x,y-12);
      b._x=x;b._y=y;
    });
    t++;starRAF=requestAnimationFrame(frame);
  }
  cv.onclick=(e)=>{
    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(cv.width/rect.width), my=(e.clientY-rect.top)*(cv.height/rect.height);
    let hit=null;bodies.forEach(b=>{if(Math.hypot(mx-b._x,my-b._y)<16)hit=b.a.id;});
    if(hit){ST.sel=hit;renderCrew();ST.tab='focus';renderTabs();renderView();}
  };
  cancelAnimationFrame(starRAF);frame();
}
function stopStars(){if(starRAF){cancelAnimationFrame(starRAF);starRAF=null;}window.onresize=null;}

/* ══════════════════ LIVE SIMULATION ══════════════════ */
function tick(){
  // clock
  const d=new Date();
  $('#clock').textContent=d.toISOString().slice(11,19);
  // drift revenue & spend a touch to feel alive
  if(Math.random()<0.35){
    ST.revenue += +(Math.random()*4.5).toFixed(2);
    ST.spend   += +(Math.random()*0.12).toFixed(2);
    renderKPIs();
    if(ST.tab==='revenue'||ST.tab==='treasury')renderView();
  }
}
function cycleAgents(){
  // occasionally flip a non-blocked agent's status to simulate event firing
  const pool=AGENTS.filter(a=>a.status!=='blocked');
  const a=pool[Math.floor(Math.random()*pool.length)];
  if(!a)return;
  if(a.status==='working'){a.status=(a.mode==='auto'?'auto':'idle');}
  else if(a.status==='idle'){a.status='working';ST.tasksDone++;ST.tasksToday++;
    TIMELINE.unshift({ago:'now',tx:`<b>${a.name}</b> fired — new task in ${a.role}`});
    if(TIMELINE.length>14)TIMELINE.pop();}
  renderCrew();renderKPIs();
  if(ST.tab==='focus'||ST.tab==='timeline')renderView();
  if(ST.tab==='starchart'){/* stars read status live via bodies rebuild */startStars();}
}

/* ══════════════════ BOOT ══════════════════ */
renderKPIs();renderCrew();renderTabs();renderView();
setInterval(tick,1000);
setInterval(cycleAgents,4200);
</script>
</body>
